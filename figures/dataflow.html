<style>
:root{--ink:#1f2328;--muted:#656d76;--rule:#d0d7de;--soft:#f6f8fa;--sans:system-ui,-apple-system,"Segoe UI","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;--mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace}
*{box-sizing:border-box}
html{scrollbar-gutter:stable;overflow-y:scroll;scrollbar-width:thin;scrollbar-color:#d0d7de transparent}
@supports not (scrollbar-width:thin){::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#d0d7de;border-radius:4px}::-webkit-scrollbar-thumb:hover{background:#8c959f}}
body{margin:0;background:#fff;color:var(--ink);font-family:var(--sans)}
.wrap{max-width:1856px;margin:0 auto}
svg{display:block;width:100%;height:auto;font-family:var(--sans)}
.title{font-size:20px;font-weight:600;fill:var(--ink)}
.h{font-size:14px;font-weight:600;fill:var(--ink)}
.s{font-size:13px;font-weight:600;fill:var(--ink)}
.m{font-family:var(--mono);font-size:12px;fill:var(--ink)}
.b{font-weight:700}
.mu{fill:var(--muted)}
.n{font-size:11px;fill:var(--muted)}
.n2{font-size:12.5px;fill:var(--ink)}
.frame{fill:#fff;stroke:var(--rule)}
.src .frame{fill:none;stroke-dasharray:4 3}
.log .frame{stroke-dasharray:2 3}
.step .frame{fill:var(--soft)}
.out .frame{stroke:var(--ink);stroke-width:1.4}
.hit{fill:transparent}
.chip .hit{fill:#fff}
.frame.hit{fill:#fff} .step .frame.hit{fill:var(--soft)}
.row{cursor:pointer;outline:none}
.row:hover .hit,.row:focus-visible .hit{fill:#eef1f4}
.row.sel .hit{fill:#e4e8ec}
.row.sel .frame.hit,.node.sel>.frame{stroke:var(--ink);stroke-width:1.6;stroke-dasharray:none}
.chip.sel .hit{stroke-width:2.2}
.edge{fill:none;stroke-width:1.2;transition:opacity .15s}
.node{transition:opacity .15s}
svg.focus .edge{opacity:.12} svg.focus .edge.on{opacity:1;stroke-width:2}
svg.focus .node{opacity:.32} svg.focus .node.on{opacity:1}
.dock{margin:0 32px 28px;border-top:1.4px solid var(--ink);padding-top:14px;min-height:232px;display:grid;grid-template-columns:462px 1fr;column-gap:70px}
.dock .stage{font-size:12px;color:var(--muted);margin:0 0 6px}
.dock h2{font-size:18px;font-weight:600;margin:0 0 8px;word-break:break-all}
.dock h2.mono{font-family:var(--mono);font-size:16px}
.dock p{font-size:13.5px;line-height:1.6;margin:0 0 12px}
.dock code{font-family:var(--mono);font-size:12px}
.rel{display:grid;grid-template-columns:36px 1fr;row-gap:6px;font-size:12px;color:var(--muted);align-items:baseline}
.rel div{display:flex;flex-wrap:wrap;gap:4px 6px}
.rel button{font:12px var(--mono);color:var(--ink);background:#fff;border:1px solid var(--rule);border-radius:4px;padding:1px 6px;cursor:pointer}
.rel button.cn{font-family:var(--sans)}
.rel button:hover{background:#eef1f4}
.fl{font-size:12px;color:var(--muted);margin:0 0 6px}
.fields{columns:3 380px;column-gap:40px;margin:0;padding:0;list-style:none}
.fields li{display:grid;grid-template-columns:186px 1fr;column-gap:10px;font-size:12.5px;line-height:1.5;padding:3px 0;border-bottom:1px solid #eaeef2;break-inside:avoid}
.fields .k{font-family:var(--mono);font-size:12px}
.fields .k.cn{font-family:var(--sans);font-size:12.5px}
.fields .pk{font-weight:700}
.fields .v{color:var(--muted)}
.dock.idle{visibility:hidden}
@media (max-width:900px){.dock{grid-template-columns:1fr;row-gap:16px}}
</style>
</head>

","按评测数分档的 k 波动",0],["method_comparison","三种方法对比",0],["tree_params","树模型参数比较",0],["feature_importance","特征重要性",0],["signal_b_fit","信号 B 拟合",0],["signal_b_comparison","信号 A、B 对比",0],["fusion_comparison × 2","融合对比",0],["fusion_by_reviews × 2","按评测数分档的融合",0],["calibration_comparison × 2","校准对比",0],["calibration_age","倍数随游戏年龄的变化",0]],"box":"figs","st":"输出"},"out_q":{"t":"单款查询","fl":"输出","d":"`python -m query <appid>`：采这一款，重跑清洗，套冻结的公式。","f":[["估计销量","评测数 × k",0],["80% 预测区间","有 B：0.59 至 1.73 倍；无 B：0.42 至 3.32 倍",0],["置信标签","高 / 中 / 低，按两路分歧和评测数",0]],"box":"out_q","st":"输出"}}, BOX={"b_raw_ars_players_2018":["raw_ars_players_2018"],"s_ars":["s_ars"],"b_raw_truth_gamalytic":["raw_truth_gamalytic"],"s_gam":["s_gam"],"b_raw_truth_manual":["raw_truth_manual"],"s_man":["s_man"],"b_raw_query_targets":["raw_query_targets"],"s_q":["s_q"],"b_raw_store_items":["raw_store_items","raw_store_tags","raw_tag_names"],"s_store":["s_store"],"cleaned_games":["cleaned_games"],"b_raw_review_windows":["raw_review_windows","raw_reviews"],"s_rev":["s_rev"],"b_raw_review_counts":["raw_review_counts"],"cleaned_review_counts":["cleaned_review_counts"],"b_raw_itad_ids":["raw_itad_ids","raw_price_history"],"s_itad":["s_itad"],"cleaned_prices":["cleaned_prices"],"b_raw_charts_monthly":["raw_charts_monthly"],"s_charts":["s_charts"],"cleaned_charts_monthly":["cleaned_charts_monthly"],"cleaned_sales_truth":["cleaned_sales_truth"],"raw_crawl_log":["raw_crawl_log"],"samples":["cleaned_samples"],"a_cmp":["a_cmp"],"a_sa":["a_sa"],"a_sb":["a_sb"],"a_fu":["a_fu"],"a_ca":["a_ca"],"b_result":["result_cv_scores","result_cv_predictions"],"frozen":["frozen"],"figs":["figs"],"out_q":["out_q"]};
const svg=document.querySelector('svg'), dock=document.getElementById('dock');
const edges=[...svg.querySelectorAll('.edge')], nodes=[...svg.querySelectorAll('.node')], rows=[...svg.querySelectorAll('.row')];
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
const isCn=s=>/[一-鿿]/.test(s);
function clear(){svg.classList.remove('focus');[...edges,...nodes,...rows].forEach(e=>e.classList.remove('on','sel'));dock.innerHTML='';dock.classList.add('idle')}
function light(test){
  const lit=new Set();
  edges.forEach(e=>{const o=test(e);e.classList.toggle('on',o);if(o){lit.add(e.dataset.from);lit.add(e.dataset.to)}});
  nodes.forEach(n=>n.classList.toggle('on',lit.has(n.dataset.box)));
  svg.classList.add('focus');
}
function rel(label,ids){
  if(!ids.length)return'';
  return `<span>${label}</span><div>${ids.map(i=>`<button data-go="${i}"${isCn(D[i].t)?' class="cn"':''}>${esc(D[i].t)}</button>`).join('')}</div>`;
}
function show(id){
  const d=D[id], row=svg.querySelector(`.row[data-id="${id}"]`), path=row.dataset.path;
  rows.forEach(r=>r.classList.toggle('sel',r===row));
  nodes.forEach(n=>n.classList.toggle('sel',n.dataset.box===d.box&&!row.classList.contains('chip')&&!row.querySelector('.frame')));
  if(path) light(e=>e.dataset.tags.includes(path));
  else light(e=>e.dataset.from===d.box||e.dataset.to===d.box);
  svg.querySelector(`.node[data-box="${d.box}"]`).classList.add('on');
  const up=[],down=[];
  if(!path) edges.forEach(e=>{
    if(e.dataset.to===d.box) BOX[e.dataset.from].forEach(i=>up.includes(i)||up.push(i));
    if(e.dataset.from===d.box) BOX[e.dataset.to].forEach(i=>down.includes(i)||down.push(i));
  });
  const r=rel('上游',up)+rel('下游',down);
  const f=d.f?`<div><p class="fl">${d.fl||'字段'}</p><ul class="fields">${d.f.map(([k,v,pk])=>`<li><span class="k${pk?' pk':''}${isCn(k)&&!/[a-z_]{3}/.test(k)?' cn':''}">${esc(k)}</span><span class="v">${pk?'主键':esc(v)}</span></li>`).join('')}</ul></div>`:'';
  dock.classList.remove('idle');dock.innerHTML=`<div><p class="stage">${esc(d.st)}</p><h2${isCn(d.t)?'':' class="mono"'}>${esc(d.t)}</h2><p>${fmt(d.d)}</p>${r?`<div class="rel">${r}</div>`:''}</div>${f}`;
}
rows.forEach(r=>{
  const go=ev=>{ev.stopPropagation();r.classList.contains('sel')?clear():show(r.dataset.id)};
  r.addEventListener('click',go);
  r.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();go(ev)}});
});
svg.addEventListener('click',clear);
dock.addEventListener('click',ev=>{const b=ev.target.closest('[data-go]');if(b)show(b.dataset.go)});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')clear()});
clear();
</script>
