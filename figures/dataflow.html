<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>steamsales-estimator 数据流</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 布局：阶段标签 → [数据流图 | 详情栏] → 字段字典。只用亮色。 */
:root{
  --bg:#ffffff; --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --soft:#f6f8fa;
  --train:#0969da; --calib:#bc4c00; --query:#1a7f37; --warn:#cf222e; --warnbg:#ffebe9; --inferbg:#fff8c5;
  --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6;margin:0}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
code,.mono{font-family:var(--mono);font-size:.92em}
p{margin:0}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
nav.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:1500px;margin:0 auto;display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;padding-block:8px}
.tabs{display:flex;gap:2px;overflow-x:auto;min-width:0}
.st{flex:none;font:inherit;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;padding:6px 8px;cursor:pointer;white-space:nowrap}
.st:hover{color:var(--fg)}
.st[aria-current="step"]{color:var(--fg);border-bottom-color:var(--fg);font-weight:600}
.right{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pb{font:inherit;font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 10px;cursor:pointer}
.pb.t{color:var(--train)} .pb.c{color:var(--calib)} .pb.q{color:var(--query)}
.pb[aria-pressed="true"]{background:var(--soft);font-weight:600;border-color:currentColor}
button:focus-visible,.node:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--train);outline-offset:2px}

main{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;padding-block:14px 24px}
@media (max-width:1060px){main{grid-template-columns:minmax(0,1fr)}}
.board{border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:calc(100vh - 124px);min-width:0;scroll-behavior:smooth}
@media (max-width:1060px){.board{max-height:70vh}}
@media (prefers-reduced-motion:reduce){.board{scroll-behavior:auto}}
.board svg{display:block}

.band{fill:transparent} .band.cur{fill:var(--soft)}
.bandlbl{font-size:14px;fill:var(--muted)} .bandlbl.cur{fill:var(--fg);font-weight:600}
.node{cursor:pointer}
.node .box{fill:var(--bg);stroke:var(--line);stroke-width:1}
.node.src .box{stroke-dasharray:4 3}
.node.step .box{fill:var(--soft);stroke:var(--muted)}
.node .t{font-size:13px;font-weight:600;fill:var(--fg)}
.node .t.mono{font-family:var(--mono);font-size:12.5px}
.node .k{font-family:var(--mono);font-size:12px;fill:var(--muted)}
.node:hover .box{stroke:var(--fg)}
.node.sel .box{stroke:var(--fg);stroke-width:2}
.node.dim{opacity:.3}
.edge path.vis{fill:none;stroke:#8c959f;stroke-width:1.2}
.edge.T path.vis{stroke:var(--train)} .edge.C path.vis{stroke:var(--calib)} .edge.Q path.vis{stroke:var(--query)}
.edge.dash path.vis{stroke-dasharray:4 4}
.edge .hit{fill:none;stroke:transparent;stroke-width:12;cursor:pointer}
.lbl{display:none;font-size:12.5px;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round;pointer-events:none}
.lbl.T{fill:var(--train)} .lbl.C{fill:var(--calib)} .lbl.Q{fill:var(--query)}
.lbl.show{display:block}
.edge.on path.vis{stroke-width:2.4}
.edge.dim{opacity:.15}

aside.panel{position:sticky;top:60px;align-self:start;max-height:calc(100vh - 76px);overflow:auto;border:1px solid var(--line);border-radius:8px;padding:16px 16px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:1060px){aside.panel{position:static;max-height:none}}
.panel h2{font-size:17px;margin:0;font-weight:600;word-break:break-all}
.panel h2.mono{font-family:var(--mono);font-size:16px}
.panel h3{font-size:14px;margin:0 0 4px;font-weight:600;color:var(--muted)}
.back{font:inherit;font-size:14px;color:var(--muted);background:none;border:none;padding:0;cursor:pointer;align-self:flex-start}
.back:hover{color:var(--fg)}
ul.rules{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:2px}
.formula{font-family:var(--mono);font-size:13px;background:var(--soft);border-radius:6px;padding:8px 10px;white-space:pre-wrap;line-height:1.6}
.fld{display:flex;flex-direction:column;gap:3px;padding:8px 0;border-top:1px solid var(--line)}
.fld:first-child{border-top:none;padding-top:0}
.fn{font-family:var(--mono);font-size:14px;font-weight:600;word-break:break-all}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:inherit;font-size:13px;line-height:1.6;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:0 9px;cursor:pointer;white-space:nowrap}
.chip:hover{background:var(--soft)}
.flag{font-size:13px;border-radius:4px;padding:0 6px;white-space:nowrap;margin-left:4px}
.flag.none{color:var(--muted);border:1px solid var(--line)}
.links{display:flex;flex-direction:column;gap:4px}
details.more>summary{cursor:pointer;color:var(--muted);font-size:14px}
table.mini{border-collapse:collapse;width:100%;font-size:14px}
table.mini th,table.mini td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.mini th{color:var(--muted);font-weight:600}
.pager{display:flex;justify-content:space-between;gap:8px}

.legend{max-width:1500px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--muted);padding-block:0 4px}
.legend b{font-family:var(--mono);font-weight:600}
section.appx{max-width:1500px;margin:0 auto;padding-block:8px 48px;display:flex;flex-direction:column;gap:10px}
.appx h2{font-size:16px;margin:0;font-weight:600}
.appx .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:8px}
.appx details{border:1px solid var(--line);border-radius:6px}
.appx summary{cursor:pointer;padding:6px 12px;font-family:var(--mono);font-size:14px}
.appx .body{padding:0 12px 10px;overflow-x:auto}
</style>

<nav class="bar gut"><div class="bar-in">
  <div class="tabs" id="tabs"></div>
  <div class="right">
    <button type="button" class="pb t" data-path="T" aria-pressed="false" id="pt">train</button>
    <button type="button" class="pb c" data-path="C" aria-pressed="false" id="pc">calib</button>
    <button type="button" class="pb q" data-path="Q" aria-pressed="false" id="pq">query</button>
  </div>
</div></nav>

<main class="gut">
  <div style="min-width:0;display:flex;flex-direction:column;gap:6px">
    <div class="board" id="board"></div>
    <div class="legend" id="legend"></div>
  </div>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</main>

<section class="appx gut">
  <h2>字段字典</h2>
  <div class="grid" id="appx"></div>
</section>

<script>
const SPLIT={T:{name:'train',d:'2018，真值 = 玩家数'},C:{name:'calib',d:'近年，真值 = 销量'},Q:{name:'query',d:'当天，无真值'}};
const F=(f,m,to=[],o={})=>({f,m,to,...o});

const STAGES=[
 {id:'collect',name:'采集',cols:[0,1],what:'crawler 从 Steam 商店接口、Steam 评测接口、SteamCharts 采集，另导入 Ars 玩家数表、近年真值表、历史价格表，原样写入 raw。',
  rules:['只有 crawler 联网','限速、超时、退避重试','按主键续传；空结果记 raw_crawl_log','评测只取截止日前计数 + 少量抽样','不爬 SteamDB']},
 {id:'clean',name:'清洗',cols:[2],what:'整理与截止日无关的游戏信息、价格、在线人数。',
  rules:['剔除：免费、非游戏、零评测、重复、上架晚于截止日','剔除写日志','只按输入侧条件筛选','抢先体验：上架日取首条评测日期','无历史价：用当前原价，深度折扣占比和平均实付价格留空','历史价两来源冲突以 ITAD 为准']},
 {id:'sample',name:'拼样本',cols:[3],what:'一款游戏 + 一个截止日 → cleaned_samples 一行。',
  formula:'H = Σ c_m · d_m\nc_m 月均在线人数，d_m 当月小时数\n累加到截止日所在月的前一月',
  rules:['截止日截断只在此做一次','train：评测数 ≥ 500','calib：校验评测数足够、截止日不早于 2013-11','train 不含 calib 的 appid','playtime_forever 不进特征']},
 {id:'train1',name:'第一次训练',cols:[4],what:'train 行：训练树模型，拟合信号 B 的 a、b。',
  rules:['树答案：ln k = ln(truth_value / total_reviews)','树输入：除 p_post 外全部特征','五折交叉验证选模型和特征','B：ln h = a + b·ln t_med，h = H / 玩家数']},
 {id:'train2',name:'第二次训练与评估',cols:[5],what:'calib 行：拟合校准式 4 个系数，留一法评估。',
  formula:'ln k_true = β·ln k_tree + γ₀ + δ·p_post + η·ln R',
  rules:['留一法：每次留出一款，用其余拟合后预测它','指标：±30% 命中率、95% 区间覆盖率（Wilson 区间）','calib 的留一法预测写入 result_estimates']},
 {id:'freeze',name:'冻结',cols:[6],what:'用全部数据重拟合一次，保存后冻结。',
  rules:['树、a、b：全部 train 行','β γ₀ δ η：全部 calib 行','σ_A、σ_B、μ_B、融合 σ：全部留一法残差','报告只引用留一法成绩']},
 {id:'predict',name:'预测',cols:[7,8],what:'信号 A、B → 融合 → 区间 → 标签。',
  formula:'A    ln Ŝ_A = ln R + ln k_true\nB    Ŝ_B = H / h\n融合 ln Ŝ = (w_A·ln Ŝ_A + w_B·(ln Ŝ_B + μ_B)) / (w_A + w_B)，w = 1/σ²\n区间 [Ŝ·e^(−1.96σ), Ŝ·e^(1.96σ)]\n分歧 D = |ln Ŝ_A − (ln Ŝ_B + μ_B)|，τ = 0.5',
  rules:['B 不可用时只用 A','只读冻结模型和参数'],
  table:{head:['B','分歧','评测数','标签'],rows:[['有','D ≤ τ','≥ 500','高'],['有','D ≤ τ','< 500','中'],['有','D > τ','—','低'],['无','—','≥ 500','中'],['无','—','< 500','低']]}},
 {id:'show',name:'展示',cols:[9],what:'viz 只读 result 表出图；单款查询出结果页。',rules:['一条命令重新生成全部图']}
];

const N=[
{id:'s_ars',col:0,y:70,kind:'src',title:'Ars 2018 玩家数表',kv:['arstechnica.com'],what:'Ars Technica 2018-07 公开的各游戏玩家数（数据来自 Steam 接口泄露）。现成表格，导入。',
 rules:['站点：arstechnica.com','截止日：2018-07-01','真值：玩家数，不是销量','用途：train 的真值']},
{id:'s_truth',col:0,y:180,kind:'src',title:'近年销量真值表',kv:['人工核对，多来源'],what:'近年公开销量，人工筛选核对后整理成表，每款一条。只收录评测数足够、截止日不早于 2013-11 的游戏。现成表格，导入。',
 rules:['来源之一：gamalytic.com 文章《How to accurately estimate Steam sales》中的公开销量对照表','每条记录的出处存在 raw_truth.source_url','用途：calib 的真值']},
{id:'s_app',col:0,y:310,kind:'src',title:'Steam 商店接口',kv:['store.steampowered.com'],what:'Steam 官方商店的 appdetails 接口，按 appid 返回游戏信息。',
 rules:['地址：store.steampowered.com/api/appdetails?appids=<appid>','返回：类型、发售日、是否免费、当前价格','只有当前价，没有历史价']},
{id:'s_cnt',col:0,y:450,kind:'src',title:'Steam 评测接口 · 计数',kv:['store.steampowered.com'],what:'Steam 官方评测接口返回的汇总数（query_summary），只取计数，不翻页。',
 rules:['地址：store.steampowered.com/appreviews/<appid>?json=1','按日期范围限定在截止日前','口径：全部、好评、Steam 内购买、政策后、各语言']},
{id:'s_smp',col:0,y:565,kind:'src',title:'Steam 评测接口 · 抽样',kv:['store.steampowered.com'],what:'同一评测接口返回的单条评测列表，只取少量。',
 rules:['地址：store.steampowered.com/appreviews/<appid>?json=1','取字段：评测时间、写评测时的时长、当前总时长','不是严格随机样本']},
{id:'s_charts',col:0,y:670,kind:'src',title:'SteamCharts',kv:['steamcharts.com'],what:'第三方统计站点，每款游戏的逐月在线人数表。',
 rules:['地址：steamcharts.com/app/<appid>','取字段：月平均在线（Avg. Players）、月峰值','只用截止日所在月之前的整月']},
{id:'s_price',col:0,y:775,kind:'src',title:'历史价格表',kv:['isthereanydeal.com','web.archive.org'],what:'早期探索版本已采集好的历史价格，导入。',
 rules:['IsThereAnyDeal（isthereanydeal.com）：价格历史','互联网档案馆（web.archive.org）：Steam 商店页历史快照中的价格']},
{id:'s_cli',col:0,y:1000,kind:'src',title:'python -m query',kv:['本地命令'],what:'单款查询入口，输入 appid，截止日默认当天。',rules:['crawler → pipeline → analysis → viz','只预测，不重新拟合']},

{id:'raw_ars',col:1,y:70,kind:'tbl',title:'raw_ars_players_2018',key:'appid',what:'Ars 玩家数表原样。',
 fields:[F('players','2018-07-01 玩家数',['samples'],{key:1}),F('appid','游戏编号',['samples']),F('title','游戏名',[],{flag:'none'}),F('fetched_at','导入时间',[],{flag:'none'})]},
{id:'raw_truth',col:1,y:180,kind:'tbl',title:'raw_truth',key:'appid',what:'近年真值表原样。',
 fields:[F('sales','销量',['samples'],{key:1}),F('cutoff_date','销量公布日',['samples'],{key:1}),F('appid','游戏编号',['samples']),F('name','游戏名',[],{flag:'none'}),F('source_url','出处',[],{flag:'none'}),F('fetched_at','导入时间',[],{flag:'none'})]},
{id:'raw_app',col:1,y:300,kind:'tbl',title:'raw_appdetails',key:'appid',what:'商店信息原样。',
 fields:[F('is_free','是否免费',['games'],{key:1}),F('release_date','发售日',['games'],{key:1}),F('genres','类型',['games'],{key:1}),F('app_type','游戏 / DLC / 软件',['games']),F('initial_price_usd','当前原价',['prices_c']),F('name','游戏名',['games']),F('fetched_at','采集时间',[],{flag:'none'})]},
{id:'raw_cnt',col:1,y:450,kind:'tbl',title:'raw_review_counts',key:'(appid, cutoff_date, query)',what:'按截止日、按口径的评测数。',
 fields:[F('query','口径：全部 / 好评 / Steam 内购买 / 政策后 / 某语言',['samples'],{key:1}),F('count','条数',['samples'],{key:1}),F('cutoff_date','截止日'),F('fetched_at','采集时间',[],{flag:'none'})]},
{id:'raw_smp',col:1,y:570,kind:'tbl',title:'raw_review_sample',key:'(appid, cutoff_date, review_id)',what:'抽样评测。',
 fields:[F('playtime_at_review_min','写评测时的时长（分钟）',['samples'],{key:1}),F('created_at','评测日期',['games']),F('playtime_forever_min','采集当天的总时长',[],{flag:'none'}),F('review_id','评测编号'),F('fetched_at','采集时间',[],{flag:'none'})]},
{id:'raw_charts',col:1,y:670,kind:'tbl',title:'raw_charts_monthly',key:'(appid, month)',what:'月度在线人数原样。',
 fields:[F('avg_players','月均同时在线',['charts_c'],{key:1}),F('month','YYYY-MM'),F('fetched_at','采集时间',[],{flag:'none'})]},
{id:'raw_price',col:1,y:770,kind:'tbl',title:'raw_price_history',key:'(appid, date, source)',what:'历史价格原样，两个来源都存。',
 fields:[F('base_price_usd','原价',['prices_c'],{key:1}),F('discount_percent','折扣',['prices_c'],{key:1}),F('source','ITAD / 档案馆',['prices_c']),F('date','日期'),F('fetched_at','导入时间',[],{flag:'none'})]},
{id:'raw_log',col:1,y:900,kind:'tbl',title:'raw_crawl_log',key:'(source, request_key)',what:'请求记录，不参与计算。',
 fields:[F('status','HTTP 状态 / 未收录 / 空结果',[],{key:1}),F('source','站点'),F('request_key','请求内容')]},

{id:'games',col:2,y:310,kind:'tbl',title:'cleaned_games',key:'appid',what:'游戏级信息，剔除在此完成。',
 fields:[F('release_date','上架日',['samples'],{key:1}),F('genres','类型',['samples'],{key:1}),F('release_date_source','商店 / 首条评测'),F('name','游戏名',['page'])]},
{id:'charts_c',col:2,y:670,kind:'tbl',title:'cleaned_charts_monthly',key:'(appid, month)',what:'清洗后的月度在线人数。',
 fields:[F('avg_players','c_m',['samples'],{key:1})]},
{id:'prices_c',col:2,y:770,kind:'tbl',title:'cleaned_prices',key:'(appid, date)',what:'清洗后的价格序列。',
 fields:[F('base_price_usd','原价',['samples'],{key:1}),F('price_source','history / current',['samples'],{key:1}),F('discount_percent','折扣',['samples'])],
 formula:'实付价 = 原价 × (1 − 折扣)\navg_price_usd = 截止日前逐日实付价的平均',

{id:'logs',col:2,y:900,kind:'src',title:'data/logs/',what:'剔除与降级记录。',
 rules:['剔除：免费、非游戏、零评测、重复、上架晚于截止日','不进 train：评测数 < 500','calib 校验不通过：评测太少或截止日早于 2013-11']},

{id:'samples',col:3,y:90,h:910,kind:'tbl',title:'cleaned_samples',key:'sample_id',what:'一行 = 一款游戏 + 一个截止日。analysis 只读此表。',
 fields:[
  F('split','train / calib / query',['A1','A2','A3','A5'],{key:1}),
  F('cutoff_date','train 2018-07-01；calib 公布日；query 当天',[],{key:1}),
  F('truth_value','train 玩家数；calib 销量；query 空',['A1','A2','A3','figures'],{key:1}),
  F('total_reviews','R，全部评测数',['A1','A3','A5'],{key:1}),
  F('p_post','2019-11-01 起评测占比',['A3'],{key:1}),
  F('playtime_median_hrs','t_med，评测时长中位数（小时）',['A1','A2'],{key:1}),
  F('charts_total_hours','H，总游玩小时',['A2','A5'],{key:1}),
  F('sample_id','样本编号',['A5']),F('appid','游戏编号'),
  F('positive_rate','好评 / 全部',['A1']),F('steam_purchase_ratio','Steam 内购买 / 全部',['A1']),F('share_<语言>','某语言 / 全部',['A1']),
  F('price_at_cutoff_usd','截止日原价',['A1']),F('frac_time_cut75','截止日前折扣 ≥ 75% 的时间占比',['A1']),F('avg_price_usd','截止日前按天平均的实付价格',['A1']),F('price_source','history / current'),
  F('game_age_years','截止日时发售年数',['A1']),F('genre_<类型>','0 / 1，含 genre_indie',['A1']),
  F('playtime_mean_hrs','评测时长均值',[],{flag:'none'}),F('sample_n','抽样条数，用于设定时长可靠性阈值')]},

{id:'A1',col:4,y:150,kind:'step',title:'树模型',kv:['train 行','ln k','五折 CV'],what:'第一次训练：学 ln k。'},
{id:'A2',col:4,y:330,kind:'step',title:'信号 B 换算',kv:['train 行','ln h = a + b·ln t_med'],what:'第一次训练：拟合 a、b。',
 formula:'ln h = a + b·ln t_med\nh = H / 玩家数'},
{id:'A3',col:5,y:520,kind:'step',title:'校准 + 留一法',kv:['calib 行','β γ₀ δ η','σ、μ_B'],what:'第二次训练与评估。',
 formula:'ln k_true = β·ln k_tree + γ₀ + δ·p_post + η·ln R'},
{id:'models',col:6,y:160,kind:'src',title:'data/models/',what:'树模型文件，冻结。'},
{id:'params',col:6,y:320,kind:'tbl',title:'result_params',key:'name',kv:['a b','beta gamma0 delta eta','sigma_* mu_b'],what:'冻结参数。',
 fields:[F('name','参数名',[],{key:1}),F('value','参数值',['A5'],{key:1})],
 table:{head:['name','含义','来自'],rows:[['a, b','信号 B 时长换算','第一次训练'],['beta gamma0 delta eta','校准式 4 个系数','第二次训练'],['sigma_a sigma_b','两路误差，融合权重 1/σ²','留一法残差'],['mu_b','信号 B 偏差修正','留一法残差'],['sigma_fused','两路都有时的区间 σ','留一法残差']]}},
{id:'featimp',col:6,y:480,kind:'tbl',title:'result_feature_importance',key:'feature',what:'树模型特征重要性。',
 fields:[F('feature','特征名',[],{key:1}),F('importance','重要性',['figures'],{key:1})]},
{id:'A5',col:7,y:720,kind:'step',title:'估算',kv:['A · B · 融合','区间 · 标签'],what:'对一个样本出估计。'},
{id:'estimates',col:8,y:560,kind:'tbl',title:'result_estimates',key:'sample_id',what:'每个样本的估计。calib 存留一法预测。',
 fields:[F('ln_fused','融合对数销量',['figures','page'],{key:1}),F('lower, upper','95% 区间',['figures','page'],{key:1}),F('label','高 / 中 / 低',['figures','page'],{key:1}),
  F('ln_a','信号 A',['figures']),F('ln_b','信号 B',['figures']),F('b_unavailable_reason','B 不可用原因',['page']),F('sigma','σ'),F('divergence','D',['page'])],
 rules:['calib：留一法预测','query：单款估计','train：不写入']},
{id:'figures',col:9,y:430,kind:'src',title:'figures/',what:'评估图表。',
 table:{head:['图','内容'],rows:[['k 的分布','直方图，对数轴'],['评测数与销量','对数散点'],['政策前后 k','按年 k 中位数'],['估计与真值','A、B、融合，±30% 带'],['命中率对比','带 Wilson 区间'],['预测区间','覆盖率'],['置信标签','各档命中率'],['特征重要性','排序']]}},
{id:'page',col:9,y:720,kind:'src',title:'单款查询页',what:'A、B、融合、区间、标签。'}
];

const E=[
['s_ars','raw_ars','T','原样导入'],['s_truth','raw_truth','C','原样导入'],['s_app','raw_app','TCQ','按 appid 采集'],['s_cnt','raw_cnt','TCQ','按截止日、口径计数'],
['s_smp','raw_smp','TCQ','抽样单条评测'],['s_charts','raw_charts','TCQ','逐月采集'],['s_price','raw_price','TC','原样导入'],
['s_cli','s_app','Q','触发采集',{dash:1,side:'L',off:22}],['s_cli','s_cnt','Q','触发采集',{dash:1,side:'L',off:30}],
['s_cli','s_smp','Q','触发采集',{dash:1,side:'L',off:38}],['s_cli','s_charts','Q','触发采集',{dash:1,side:'L',off:46}],
['raw_app','games','TCQ','剔除免费 / 非游戏；取发售日、类型'],['raw_smp','games','TCQ','抢先体验：首条评测日期作上架日'],
['raw_app','prices_c','TCQ','无历史价时当前原价兜底'],['raw_price','prices_c','TC','两来源合并，冲突以 ITAD 为准'],['raw_charts','charts_c','TCQ','只留月均'],
['games','logs','TCQ','剔除记录',{dash:1,side:'R',off:30}],
['raw_ars','samples','T','train 行，真值 = 玩家数'],['raw_truth','samples','C','calib 行，真值 = 销量'],
['raw_cnt','samples','TCQ','各口径 ÷ 全部 → 好评率、p_post 等'],['raw_smp','samples','TCQ','时长中位数 → t_med'],
['games','samples','TCQ','截止日 − 上架日 → 年龄；类型 → genre_*'],['charts_c','samples','TCQ','Σ 月均 × 当月小时 → H'],['prices_c','samples','TCQ','截止日原价、深度折扣占比、平均实付价格'],
['s_cli','samples','Q','query 行'],
['samples','A1','T','train 行：特征（除 p_post）+ 真值'],['samples','A2','T','train 行：H、t_med、玩家数'],['samples','A3','C','calib 行：R、p_post、销量'],
['A1','A3','C','每行的 ln k_tree'],['A2','A3','C','每行的 Ŝ_B'],
['A1','models','T','全量拟合后保存'],['A1','featimp','T','特征重要性'],['A2','params','T','a、b'],['A3','params','C','β γ₀ δ η；σ、μ_B'],
['A3','estimates','C','calib 行的留一法预测'],
['samples','A5','Q','query 行'],['models','A5','Q','读冻结的树'],['params','A5','Q','读冻结参数'],['A5','estimates','Q','写入估计'],
['estimates','figures','C','对照真值算命中率、覆盖率'],['featimp','figures','T','排序图'],['estimates','page','Q','单款结果']
].map(([from,to,tags,label,o],i)=>({i,from,to,tags,label,...(o||{})}));

/* 几何 */
const W=176,STEP=250,X0=110,NCOL=10;
const byId=Object.fromEntries(N.map(n=>[n.id,n]));
N.forEach(n=>{
  n.stage=STAGES.find(s=>s.cols.includes(n.col)).id;
  n.keys=n.kv||(n.fields||[]).filter(f=>f.key).map(f=>f.f);
  if(n.id!=='samples') n.keys=n.keys.slice(0,3);
  if(!n.h) n.h=n.keys.length?40+18*n.keys.length:34;
});
const nx=n=>X0+n.col*STEP;
const anchorY=(n,o)=>n.h>200?Math.max(n.y+30,Math.min(n.y+n.h-18,o)):n.y+n.h/2;
const NS='http://www.w3.org/2000/svg';
const svgW=X0+(NCOL-1)*STEP+W+50, svgH=1080;
const svg=document.createElementNS(NS,'svg');
svg.setAttribute('viewBox',`0 0 ${svgW} ${svgH}`);svg.setAttribute('width',svgW);svg.setAttribute('height',svgH);
svg.setAttribute('role','img');svg.setAttribute('aria-label','数据流图');
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const txt=(p,a,s)=>{const t=el('text',a,p);t.textContent=s;return t};
const defs=el('defs',{},svg);
const mk=el('marker',{id:'ah',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse',markerUnits:'userSpaceOnUse'},defs);
el('path',{d:'M0,0 L10,5 L0,10 z',style:'fill:#8c959f'},mk);

const gB=el('g',{},svg);
STAGES.forEach((s,i)=>{
  s.x1=X0+s.cols[0]*STEP-24; s.x2=X0+s.cols[s.cols.length-1]*STEP+W+24;
  s.rect=el('rect',{x:s.x1,y:0,width:s.x2-s.x1,height:svgH,class:'band'},gB);
  s.lbl=txt(gB,{x:s.x1+12,y:32,class:'bandlbl'},`${i+1} ${s.name}`);
});
const gE=el('g',{},svg), gN=el('g',{},svg), gL=el('g',{},svg);
E.forEach(e=>{
  const a=byId[e.from],b=byId[e.to],am=a.y+a.h/2,bm=b.y+b.h/2;let d,lx,ly,anc='middle';
  if(a.col===b.col){const L=e.side==='L',off=e.off||24,x=L?nx(a):nx(a)+W,s=L?-1:1;d=`M${x},${am} C${x+s*off},${am} ${x+s*off},${bm} ${x-s*2},${bm}`;
    lx=x+s*(off*.75+4);ly=(am+bm)/2;anc=L?'end':'start'}
  else{const y1=anchorY(a,bm),y2=anchorY(b,y1),x1=nx(a)+W,x2=nx(b)-3,cx=(x1+x2)/2;d=`M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}`;
    if(b.col-a.col>1){lx=x2-10;ly=y2-7;anc='end'}else{lx=cx;ly=(y1+y2)/2-7}}
  const cls=['edge'];if(e.tags.length===1)cls.push(e.tags);if(e.dash)cls.push('dash');
  const g=el('g',{class:cls.join(' ')},gE);
  el('path',{d,class:'vis','marker-end':'url(#ah)'},g);
  const hit=el('path',{d,class:'hit'},g);
  el('title',{},hit).textContent=`${a.title} → ${b.title}：${e.label}`;
  e.t=txt(gL,{x:lx,y:ly,'text-anchor':anc,class:'lbl '+(e.tags.length===1?e.tags:'')},e.label);
  e.g=g;
  hit.addEventListener('mouseenter',()=>paint([e.i]));hit.addEventListener('mouseleave',()=>paint(edgesOn()));
  hit.addEventListener('click',ev=>{ev.stopPropagation();state.edge=state.edge===e.i?null:e.i;state.node=null;render()});
});
N.forEach(n=>{
  const x=nx(n);
  const g=el('g',{class:`node ${n.kind}`,tabindex:0,role:'button','aria-label':n.title},gN);
  el('rect',{x,y:n.y,width:W,height:n.h,rx:6,class:'box'},g);
  const mono=n.kind==='tbl'||(/^[a-z]/.test(n.title)&&n.kind!=='step');
  const t=txt(g,{x:x+11,y:n.y+22,class:'t'+(mono?' mono':'')},n.title);
  if(mono&&n.title.length>21)t.style.fontSize='11px';
  if(n.id==='samples'){
    let yy=n.y+42;
    Object.values(SPLIT).forEach(v=>{
      el('rect',{x:x+10,y:yy,width:W-20,height:26,rx:4,style:`fill:var(--bg);stroke:var(--${v.name})`},g);
      txt(g,{x:x+20,y:yy+18,class:'k',style:`fill:var(--${v.name});font-weight:600`},v.name);
      yy+=34;
    });
    yy+=6;n.keys.forEach(k=>{yy+=20;txt(g,{x:x+14,y:yy,class:'k'},k)});
  }else n.keys.forEach((k,i)=>txt(g,{x:x+11,y:n.y+46+i*18,class:'k'},k));
  n.g=g;
  const pick=ev=>{ev.stopPropagation();showNode(n.id)};
  g.addEventListener('click',pick);
  g.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();pick(ev)}});
});
const board=document.getElementById('board');board.appendChild(svg);

/* 状态 */
const state={stage:0,node:null,path:'',edge:null};
const edgesOn=()=>state.edge!=null?[state.edge]:state.node?E.filter(e=>e.from===state.node||e.to===state.node).map(e=>e.i):state.path?E.filter(e=>e.tags.includes(state.path)).map(e=>e.i):null;
function paint(list){
  const on=list?new Set(list):null,lit=new Set();
  E.forEach(e=>{const o=on&&on.has(e.i);e.g.classList.toggle('on',!!o);e.t.classList.toggle('show',!!o);e.g.classList.toggle('dim',!!on&&!o);if(o){lit.add(e.from);lit.add(e.to)}});
  if(state.node)lit.add(state.node);
  N.forEach(n=>{n.g.classList.toggle('dim',!!on&&!lit.has(n.id));n.g.classList.toggle('sel',n.id===state.node)});
  STAGES.forEach((s,i)=>{s.rect.classList.toggle('cur',i===state.stage);s.lbl.classList.toggle('cur',i===state.stage)});
}

/* 详情 */
const panel=document.getElementById('panel');
const flagH=f=>f==='none'?'<span class="flag none">只存档</span>':'';
const tableH=t=>`<table class="mini"><thead><tr>${t.head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
const chip=id=>`<button type="button" class="chip" data-go="${id}">${byId[id].title}</button>`;
const rulesH=r=>`<ul class="rules">${r.map(x=>`<li>${x}</li>`).join('')}</ul>`;
const fieldH=f=>`<div class="fld"><div><span class="fn">${f.f}</span>${flagH(f.flag)}</div><div>${f.m}</div>${f.to.length?`<div class="chips">${f.to.map(chip).join('')}</div>`:''}</div>`;
function stageH(i){
  const s=STAGES[i];
  let h=`<h2>${i+1} ${s.name}</h2><p>${s.what}</p>`;
  if(s.formula)h+=`<div class="formula">${s.formula}</div>`;
  if(s.table)h+=tableH(s.table);
  h+=rulesH(s.rules);
  h+=`<div class="chips">${N.filter(n=>n.stage===s.id).map(n=>chip(n.id)).join('')}</div>`;
  h+=`<div class="pager">${i>0?`<button type="button" class="back" data-stage="${i-1}">← ${STAGES[i-1].name}</button>`:'<span></span>'}${i<STAGES.length-1?`<button type="button" class="back" data-stage="${i+1}">${STAGES[i+1].name} →</button>`:''}</div>`;
  return h;
}
function nodeH(n){
  const si=STAGES.findIndex(s=>s.id===n.stage), ins=E.filter(e=>e.to===n.id), outs=E.filter(e=>e.from===n.id);
  let h=`<button type="button" class="back" data-stage="${si}">← ${si+1} ${STAGES[si].name}</button>`;
  h+=`<div><h2 class="${n.kind==='tbl'?'mono':''}">${n.title}</h2>${n.key?`<div>主键 <code>${n.key}</code></div>`:''}</div><p>${n.what}</p>`;
  if(n.formula)h+=`<div class="formula">${n.formula}</div>`;
  if(n.id==='A5'){const s=STAGES[6];h+=`<div class="formula">${s.formula}</div>${tableH(s.table)}`}
  if(n.fields){
    const k=n.fields.filter(f=>f.key),r=n.fields.filter(f=>!f.key);
    h+=`<div>${k.map(fieldH).join('')}</div>`;
    if(r.length)h+=`<details class="more"><summary>其余 ${r.length} 个字段</summary><div>${r.map(fieldH).join('')}</div></details>`;
  }
  if(n.table)h+=tableH(n.table);
  if(n.rules)h+=rulesH(n.rules);
  if(ins.length)h+=`<div><h3>来自</h3><div class="links">${ins.map(e=>`<div>${chip(e.from)} ${e.label}</div>`).join('')}</div></div>`;
  if(outs.length)h+=`<div><h3>去往</h3><div class="links">${outs.map(e=>`<div>${chip(e.to)} ${e.label}</div>`).join('')}</div></div>`;
  return h;
}
function render(){
  panel.innerHTML=state.node?nodeH(byId[state.node]):stageH(state.stage);panel.scrollTop=0;
  document.querySelectorAll('.st').forEach((b,i)=>{if(i===state.stage)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')});
  paint(edgesOn());
}
function showStage(i){
  state.stage=Math.max(0,Math.min(STAGES.length-1,i));state.node=null;state.edge=null;render();
  const s=STAGES[state.stage];board.scrollTo({left:Math.max(0,Math.min(s.x1-20,(s.x1+s.x2)/2-board.clientWidth/2))});
}
function showNode(id){
  if(state.node===id){state.node=null;render();return}
  const n=byId[id];state.node=id;state.edge=null;state.stage=STAGES.findIndex(s=>s.id===n.stage);render();
  const x=nx(n),vw=board.clientWidth,vh=board.clientHeight;
  if(x<board.scrollLeft||x+W>board.scrollLeft+vw)board.scrollTo({left:Math.max(0,x-vw/2+W/2)});
  if(n.y<board.scrollTop||n.y+60>board.scrollTop+vh)board.scrollTo({top:Math.max(0,n.y-80)});
}
panel.addEventListener('click',ev=>{const g=ev.target.closest('[data-go]');if(g){showNode(g.dataset.go);return}const s=ev.target.closest('[data-stage]');if(s)showStage(+s.dataset.stage)});
panel.addEventListener('mouseover',ev=>{const g=ev.target.closest('[data-go]');if(!g||!state.node)return;const a=state.node,b=g.dataset.go;paint(E.filter(e=>(e.from===a&&e.to===b)||(e.from===b&&e.to===a)).map(e=>e.i))});
panel.addEventListener('mouseout',ev=>{if(ev.target.closest('[data-go]'))paint(edgesOn())});
board.addEventListener('click',()=>{if(state.node||state.edge!=null){state.node=null;state.edge=null;render()}});

document.getElementById('tabs').innerHTML=STAGES.map((s,i)=>`<button type="button" class="st" data-i="${i}">${i+1} ${s.name}</button>`).join('');
document.querySelectorAll('.st').forEach(b=>b.addEventListener('click',()=>showStage(+b.dataset.i)));
document.querySelectorAll('[data-path]').forEach(b=>b.addEventListener('click',()=>{
  state.path=state.path===b.dataset.path?'':b.dataset.path;state.node=null;state.edge=null;
  document.querySelectorAll('[data-path]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.path===state.path?'true':'false'));render();
}));
document.getElementById('legend').innerHTML=Object.values(SPLIT).map(v=>`<span><b style="color:var(--${v.name})">${v.name}</b> ${v.d}</span>`).join('');


document.getElementById('appx').innerHTML=N.filter(n=>n.fields).map(n=>`<details><summary>${n.title}</summary><div class="body"><table class="mini"><thead><tr><th>字段</th><th>含义</th><th>去往</th></tr></thead><tbody>${n.fields.map(f=>`<tr><td class="mono">${f.f}</td><td>${f.m}${flagH(f.flag)}</td><td>${f.to.map(id=>byId[id].title).join('、')}</td></tr>`).join('')}</tbody></table></div></details>`).join('');

render();
</script>
